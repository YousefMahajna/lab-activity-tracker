<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Activity Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#F7F7F5; --surface:#FFFFFF; --border:#E4E4E0; --border-md:#D0CFC9;
  --text-1:#1A1A18; --text-2:#5A5A56; --text-3:#9A9A94;
  --gary-bg:#E8F1FD; --gary-fg:#1A4A8A;
  --amir-bg:#E6F4DA; --amir-fg:#235212;
  --samer-bg:#EEEAFD; --samer-fg:#3A2A9A;
  --michael-bg:#FDF0DC; --michael-fg:#6A3A08;
  --haytam-bg:#FCE8F0; --haytam-fg:#7A1A40;
  --done-bg:#EDFAF3; --done-border:#B0E8CC; --done-text:#166534;
}
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text-1); font-size:14px; line-height:1.5; min-height:100vh; }

header { background:var(--surface); border-bottom:1px solid var(--border); padding:14px 28px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; gap:12px; flex-wrap:wrap; }
.header-left { display:flex; align-items:baseline; gap:10px; }
.header-title { font-size:15px; font-weight:600; }
.header-week  { font-size:12px; color:var(--text-3); }
.header-right { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.filters { display:flex; gap:5px; flex-wrap:wrap; }
.filter-btn { font-family:'Inter',sans-serif; font-size:12px; font-weight:500; padding:4px 13px; border-radius:20px; border:1px solid var(--border-md); background:transparent; color:var(--text-2); cursor:pointer; transition:background 0.12s,color 0.12s,border-color 0.12s; }
.filter-btn:hover { background:#F0F0EC; }
.filter-btn.active { background:var(--text-1); color:#fff; border-color:var(--text-1); }
.filter-btn.f-gary.active    { background:var(--gary-bg);    color:var(--gary-fg);    border-color:var(--gary-fg); }
.filter-btn.f-amir.active    { background:var(--amir-bg);    color:var(--amir-fg);    border-color:var(--amir-fg); }
.filter-btn.f-samer.active   { background:var(--samer-bg);   color:var(--samer-fg);   border-color:var(--samer-fg); }
.filter-btn.f-michael.active { background:var(--michael-bg); color:var(--michael-fg); border-color:var(--michael-fg); }
.filter-btn.f-haytam.active  { background:var(--haytam-bg);  color:var(--haytam-fg);  border-color:var(--haytam-fg); }
.filter-btn.f-archive.active { background:#F0F0EC; color:var(--text-1); border-color:var(--text-3); }
.filter-btn.f-day { display:flex; align-items:center; gap:4px; }
.filter-btn.f-day.active-day { background:#FFF7ED; color:#92400E; border-color:#F59E0B; }

.action-btn { font-family:'Inter',sans-serif; font-size:12px; font-weight:500; padding:5px 14px; border-radius:7px; border:1px solid var(--border-md); background:var(--surface); color:var(--text-2); cursor:pointer; display:flex; align-items:center; gap:5px; transition:background 0.12s,border-color 0.12s; white-space:nowrap; }
.action-btn:hover { background:#F0F0EC; border-color:var(--text-3); }
.action-btn.primary { background:var(--text-1); color:#fff; border-color:var(--text-1); }
.action-btn.primary:hover { opacity:0.85; }
.action-btn.archive-btn { border-color:#9A9A94; color:var(--text-2); }
.action-btn.archive-btn.showing { background:#F0F0EC; border-color:var(--text-1); color:var(--text-1); }
.sep { width:1px; height:20px; background:var(--border-md); margin:0 2px; }

.main { padding:20px 28px 48px; }
.summary-bar { display:flex; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 16px; min-width:100px; }
.stat-label { font-size:11px; color:var(--text-3); font-weight:500; margin-bottom:3px; }
.stat-value { font-size:20px; font-weight:600; color:var(--text-1); }

/* archived banner */
.archive-banner { display:none; background:#FFFBEA; border:1px solid #E8D87A; border-radius:8px; padding:10px 16px; margin-bottom:14px; font-size:13px; color:#7A6010; align-items:center; gap:10px; }
.archive-banner.show { display:flex; }
.archive-search { font-family:'Inter',sans-serif; font-size:12px; padding:5px 10px; border:1px solid var(--border-md); border-radius:6px; background:var(--surface); color:var(--text-1); outline:none; width:200px; }

.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; min-width:1200px; }
thead th { font-size:11px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:0.04em; padding:9px 12px; background:#FAFAF8; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap; }
thead th.day { text-align:center; width:48px; line-height:1.3; }
thead th.c-p  { width:34px; }
thead th.c-act { min-width:170px; }
thead th.c-own { width:88px; }
thead th.c-req { width:100px; }
thead th.c-sta { min-width:260px; }
thead th.c-edit { width:48px; text-align:center; }

.group-row td { background:#FAFAF8; font-size:11px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:0.06em; padding:5px 12px; border-bottom:1px solid var(--border); border-top:1px solid var(--border); }
.group-row:first-child td { border-top:none; }

tbody tr.data-row { border-bottom:1px solid var(--border); transition:background 0.1s; }
tbody tr.data-row:last-child { border-bottom:none; }
tbody tr.data-row:hover { background:#FAFAF8; }
tbody tr.vacation-row td { opacity:0.45; font-style:italic; }

/* completed row */
tbody tr.done-row { background:var(--done-bg); }
tbody tr.done-row:hover { background:#E4F8EC; }
tbody tr.done-row td { border-bottom:1px solid var(--done-border); }
.done-badge { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; color:var(--done-text); background:#D1FAE5; border-radius:12px; padding:2px 8px; margin-top:3px; }
.done-badge svg { flex-shrink:0; }

td { padding:9px 12px; vertical-align:top; }
td.c-p { color:var(--text-3); font-size:12px; font-weight:500; text-align:center; }
.act-title { font-weight:500; font-size:13px; color:var(--text-1); line-height:1.35; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.act-sub   { font-size:11px; color:var(--text-2); margin-top:2px; }
.act-done .act-title { text-decoration:line-through; color:var(--text-3); }

/* Priority badges */
.pri-badge { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px; white-space:nowrap; letter-spacing:0.02em; flex-shrink:0; }
.pri-P1   { background:#FEE2E2; color:#991B1B; border:1px solid #FCA5A5; }
.pri-High { background:#FEF3C7; color:#92400E; border:1px solid #FCD34D; }
.pri-Mid  { background:#DBEAFE; color:#1E40AF; border:1px solid #93C5FD; }
.pri-Low  { background:#F0FDF4; color:#166534; border:1px solid #86EFAC; }

/* Priority selector in modal */
.pri-grid { display:flex; gap:8px; margin-top:4px; }
.pri-btn {
  font-family:'Inter',sans-serif; font-size:12px; font-weight:600;
  padding:5px 16px; border-radius:7px; cursor:pointer;
  transition:opacity 0.1s, transform 0.1s;
  letter-spacing:0.02em;
}
.pri-btn:not(.sel) { opacity:0.38; }
.pri-btn.sel { opacity:1; transform:scale(1.04); box-shadow:0 0 0 2px rgba(0,0,0,0.12); }
.pri-btn-P1   { background:#FEE2E2; color:#991B1B; border:1px solid #FCA5A5; }
.pri-btn-High { background:#FEF3C7; color:#92400E; border:1px solid #FCD34D; }
.pri-btn-Mid  { background:#DBEAFE; color:#1E40AF; border:1px solid #93C5FD; }
.pri-btn-Low  { background:#F0FDF4; color:#166534; border:1px solid #86EFAC; }
.pri-btn-none { background:var(--bg); color:var(--text-3); border:1px solid var(--border-md); font-weight:500; }

.owner-badge { display:inline-block; font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px; white-space:nowrap; }
.owner-Gary    { background:var(--gary-bg);    color:var(--gary-fg); }
.owner-Amir    { background:var(--amir-bg);    color:var(--amir-fg); }
.owner-Samer   { background:var(--samer-bg);   color:var(--samer-fg); }
.owner-Michael { background:var(--michael-bg); color:var(--michael-fg); }
.owner-Haytam  { background:var(--haytam-bg);  color:var(--haytam-fg); }

td.c-req { font-size:12px; color:var(--text-2); }
td.c-day { text-align:center; }

/* Status column */
.status-list { list-style:none; }
.status-entry { display:flex; gap:6px; padding:4px 0; border-bottom:1px solid var(--border); align-items:flex-start; }
.status-entry:last-child { border-bottom:none; }
.s-date { font-size:10px; font-weight:600; color:var(--text-3); white-space:nowrap; min-width:46px; padding-top:1px; }
.s-dot { width:6px; height:6px; border-radius:50%; background:var(--border-md); flex-shrink:0; margin-top:5px; }
.s-dot.latest { background:#3A8AE0; }
.s-lines { display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
.s-actions { display:flex; gap:2px; opacity:0; transition:opacity 0.1s; flex-shrink:0; padding-top:1px; }
.status-entry:hover .s-actions { opacity:1; }
.s-btn { background:none; border:none; cursor:pointer; padding:2px 4px; border-radius:4px; color:var(--text-3); font-size:11px; line-height:1; }
.s-btn:hover { background:#F0F0EC; color:var(--text-1); }
.s-btn.del:hover { background:#FFF0F0; color:#C03030; }

/* Inline status edit */
.s-edit-form { display:none; flex-direction:column; gap:4px; margin-top:3px; }
.s-edit-form.open { display:flex; }
.s-edit-row { display:flex; gap:4px; }
.s-edit-save { font-family:'Inter',sans-serif; font-size:11px; font-weight:500; padding:3px 10px; background:var(--text-1); color:#fff; border:none; border-radius:5px; cursor:pointer; }
.s-edit-cancel { font-family:'Inter',sans-serif; font-size:11px; padding:3px 8px; background:none; color:var(--text-2); border:1px solid var(--border-md); border-radius:5px; cursor:pointer; }

.add-update-btn { display:flex; align-items:center; gap:5px; font-family:'Inter',sans-serif; font-size:11px; color:var(--text-3); background:none; border:1px dashed var(--border-md); border-radius:6px; padding:3px 9px; cursor:pointer; margin-top:5px; transition:color 0.1s,background 0.1s; }
.add-update-btn:hover { color:var(--text-1); background:#F0F0EC; }
.add-form { margin-top:5px; display:none; flex-direction:column; gap:5px; }
.add-form.open { display:flex; }
.add-form textarea { font-family:'Inter',sans-serif; font-size:12px; color:var(--text-1); background:var(--bg); border:1px solid var(--border-md); border-radius:6px; padding:6px 9px; resize:none; height:auto; min-height:34px; outline:none; line-height:1.5; overflow:hidden; }
.add-form textarea:focus { border-color:#3A8AE0; }
.add-form .hint { font-size:10px; color:var(--text-3); }
/* Multi-line status display */
.s-lines { display:flex; flex-direction:column; gap:1px; flex:1; }
.s-line  { font-size:12px; color:var(--text-2); line-height:1.4; display:flex; align-items:baseline; gap:5px; }
.s-line::before { content:'·'; color:var(--border-md); flex-shrink:0; }
/* Inline status edit textarea */
.s-edit-input { font-family:'Inter',sans-serif; font-size:12px; color:var(--text-1); background:var(--bg); border:1px solid #3A8AE0; border-radius:5px; padding:4px 8px; outline:none; width:100%; resize:none; min-height:34px; line-height:1.5; overflow:hidden; }
.form-row { display:flex; gap:5px; align-items:center; }
.mark-done-check { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-2); cursor:pointer; margin-left:auto; }
.mark-done-check input { cursor:pointer; }
.btn-save { font-family:'Inter',sans-serif; font-size:12px; font-weight:500; padding:4px 13px; background:var(--text-1); color:#fff; border:none; border-radius:6px; cursor:pointer; }
.btn-save:hover { opacity:0.85; }
.btn-cancel { font-family:'Inter',sans-serif; font-size:12px; padding:4px 11px; background:none; color:var(--text-2); border:1px solid var(--border-md); border-radius:6px; cursor:pointer; }

.edit-row-btn { background:none; border:none; cursor:pointer; padding:4px 6px; color:var(--text-3); border-radius:5px; transition:background 0.1s,color 0.1s; }
.edit-row-btn:hover { background:#F0F0EC; color:var(--text-1); }

/* Modal */
.modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:200; align-items:center; justify-content:center; }
.modal-bg.open { display:flex; }
.modal { background:var(--surface); border-radius:12px; border:1px solid var(--border); padding:24px 28px; width:580px; max-width:95vw; max-height:90vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,0.12); }
.modal-title { font-size:15px; font-weight:600; margin-bottom:20px; color:var(--text-1); }
.field-group { margin-bottom:14px; }
.field-label { font-size:11px; font-weight:600; color:var(--text-3); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:5px; }
.field-input { font-family:'Inter',sans-serif; font-size:13px; color:var(--text-1); background:var(--bg); border:1px solid var(--border-md); border-radius:7px; padding:7px 11px; width:100%; outline:none; }
.field-input:focus { border-color:#3A8AE0; }
#f-sub0,#f-sub1,#f-sub2,#f-sub3,#f-sub4 { font-size:12px; padding:5px 10px; }
.field-select { font-family:'Inter',sans-serif; font-size:13px; color:var(--text-1); background:var(--bg); border:1px solid var(--border-md); border-radius:7px; padding:7px 11px; width:100%; outline:none; cursor:pointer; }
.days-grid { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.day-toggle { font-family:'Inter',sans-serif; font-size:12px; font-weight:500; padding:5px 13px; border-radius:20px; border:1px solid var(--border-md); background:var(--surface); color:var(--text-2); cursor:pointer; transition:background 0.1s,color 0.1s,border-color 0.1s; }
.day-toggle.on { background:var(--text-1); color:#fff; border-color:var(--text-1); }
.modal-done-toggle { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text-2); cursor:pointer; padding:10px 0; border-top:1px solid var(--border); margin-top:4px; }
.modal-done-toggle input { cursor:pointer; width:15px; height:15px; }
.modal-footer { display:flex; justify-content:space-between; align-items:center; margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }
.modal-footer-right { display:flex; gap:8px; }
.btn-delete { font-family:'Inter',sans-serif; font-size:12px; padding:6px 14px; background:none; color:#C03030; border:1px solid #EABABA; border-radius:7px; cursor:pointer; }
.btn-delete:hover { background:#FFF0F0; }

.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(16px); background:var(--text-1); color:#fff; font-size:13px; padding:9px 18px; border-radius:8px; opacity:0; transition:opacity 0.2s,transform 0.2s; pointer-events:none; z-index:300; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
#import-input { display:none; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <span class="header-title">Activity tracker</span>
    <span class="header-week" id="week-label"></span>
    <span id="sync-status" style="font-size:11px;color:var(--text-3);margin-left:4px;"></span>
  </div>
  <div class="header-right">
    <div class="filters">
      <button class="filter-btn active"   onclick="setFilter('all',this)">All</button>
      <button class="filter-btn f-gary"    onclick="setFilter('Gary',this)">Gary</button>
      <button class="filter-btn f-amir"    onclick="setFilter('Amir',this)">Amir</button>
      <button class="filter-btn f-samer"   onclick="setFilter('Samer',this)">Samer</button>
      <button class="filter-btn f-michael" onclick="setFilter('Michael',this)">Michael</button>
      <button class="filter-btn f-haytam"  onclick="setFilter('Haytam',this)">Haytam</button>
    </div>
    <div class="sep"></div>
    <div class="filters">
      <button class="filter-btn f-day active-day" id="btn-day-all"      onclick="setDayFilter('all',this)">All days</button>
      <button class="filter-btn f-day"             id="btn-day-today"    onclick="setDayFilter('today',this)">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1" y="2" width="10" height="9" rx="1"/><line x1="8" y1="1" x2="8" y2="3"/><line x1="4" y1="1" x2="4" y2="3"/><line x1="1" y1="5" x2="11" y2="5"/></svg>
        Today
      </button>
      <button class="filter-btn f-day"             id="btn-day-tomorrow" onclick="setDayFilter('tomorrow',this)">Tomorrow</button>
    </div>
    <div class="sep"></div>
    <button class="action-btn archive-btn" id="archive-toggle-btn" onclick="toggleArchive()">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="12" height="9" rx="1"/><path d="M1 6h12M5 9h4"/></svg>
      Show completed
    </button>
    <div class="sep"></div>
    <button class="action-btn" onclick="document.getElementById('import-input').click()">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v2h10v-2M7 2v7M4 6l3 3 3-3"/></svg>
      Import Excel
    </button>
    <button class="action-btn primary" onclick="exportExcel()">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10v2h10v-2M7 9V2M4 5l3-3 3 3"/></svg>
      Export Excel
    </button>
    <button class="action-btn" onclick="addNewRow()" style="border-color:#3A8AE0;color:#1A4A8A;">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="7" y1="2" x2="7" y2="12"/><line x1="2" y1="7" x2="12" y2="7"/></svg>
      Add row
    </button>
    <input type="file" id="import-input" accept=".xlsx,.xls" onchange="importExcel(event)">
  </div>
</header>

<div class="main">
  <div class="summary-bar" id="summary-bar"></div>
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:14px;font-size:11px;color:var(--text-3);">
    <span style="width:10px;height:10px;border-radius:50%;background:#FFF7ED;border:2px solid #F59E0B;display:inline-block;flex-shrink:0;"></span>
    Rolled over — task was planned for a past day and not yet completed
  </div>

  <div class="archive-banner" id="archive-banner">
    <svg width="15" height="15" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1" y="3" width="12" height="9" rx="1"/><path d="M1 6h12M5 9h4"/></svg>
    Showing completed tasks hidden more than 3 days ago &nbsp;·&nbsp;
    <input class="archive-search" id="archive-search" placeholder="Search activity..." oninput="render(currentFilter)">
    <button class="btn-cancel" style="margin-left:auto" onclick="toggleArchive()">Hide completed</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead id="thead-rows"></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-bg" id="modal-bg" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title">Edit row</div>
    <div class="field-group">
      <div class="field-label">Priority</div>
      <div class="pri-grid">
        <button type="button" class="pri-btn pri-btn-P1"   data-pri="P1"   onclick="selectPri(this)">P1</button>
        <button type="button" class="pri-btn pri-btn-High" data-pri="High" onclick="selectPri(this)">High</button>
        <button type="button" class="pri-btn pri-btn-Mid"  data-pri="Mid"  onclick="selectPri(this)">Mid</button>
        <button type="button" class="pri-btn pri-btn-Low"  data-pri="Low"  onclick="selectPri(this)">Low</button>
        <button type="button" class="pri-btn pri-btn-none sel" data-pri=""  onclick="selectPri(this)">None</button>
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">Activity title</div>
      <input class="field-input" id="f-title" placeholder="Activity name">
    </div>
    <div class="field-group">
      <div class="field-label">Details <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-3);font-size:10px">up to 5 lines</span></div>
      <div style="display:flex;flex-direction:column;gap:5px;">
        <input class="field-input" id="f-sub0" placeholder="Detail line 1">
        <input class="field-input" id="f-sub1" placeholder="Detail line 2">
        <input class="field-input" id="f-sub2" placeholder="Detail line 3">
        <input class="field-input" id="f-sub3" placeholder="Detail line 4">
        <input class="field-input" id="f-sub4" placeholder="Detail line 5">
      </div>
    </div>

// ---- Compute 6 rolling work days ----
function getWorkDays() {
  const today = new Date(); today.setHours(0,0,0,0);
  const dow = today.getDay();
  let start = new Date(today);
  if (dow === 5 || dow === 6) {
    start = new Date(today.getTime() + ((7 - dow) % 7 || 7) * 86400000);
  }
  const result = []; let cur = new Date(start);
  while (result.length < 6) {
    if (WORK_JS_DAYS.has(cur.getDay())) result.push(new Date(cur));
    cur = new Date(cur.getTime() + 86400000);
  }
  return result;
}

  return diff > 3 * 24 * 60 * 60 * 1000; // 3 days
}
function completedAgo(row) {
  if (!row.completedAt) return '';

// ---- Build header ----
function buildHeader() {
  const days = visibleDays;

    if (days[i-1].getDay()===4 && days[i].getDay()===0) { splitIdx=i; break; }
  }
  const week1 = splitIdx>0 ? days.slice(0,splitIdx) : days;
  const week2 = splitIdx>0 ? days.slice(splitIdx) : [];
  const colTotal = 4 + days.length + 2;

  let r1 = `<tr>
    <th class="c-p" rowspan="2">#</th>
    <th class="c-act" rowspan="2">Activity</th>
    <th class="c-own" rowspan="2">Owner</th>
    <th class="c-req" rowspan="2">Requester</th>

    r1 += `<th colspan="${week2.length}" style="text-align:center;font-size:10px;font-weight:600;color:#1A4A8A;letter-spacing:0.04em;padding:5px 0;border-bottom:1px solid var(--border);border-left:2px solid var(--border-md);background:#F0F5FD">Next week · ${fmt(week2[0])} – ${fmt(week2[week2.length-1])}</th>`;
  }
  r1 += `<th class="c-sta" rowspan="2">Status updates</th><th class="c-edit" rowspan="2">Edit</th></tr>`;

  let r2 = '<tr>';
  days.forEach((d,i)=>{
    const w2 = week2.length && i>=splitIdx;
    const bg = w2 ? 'background:#F0F5FD;' : '';
    const bl = (w2 && i===splitIdx) ? 'border-left:2px solid var(--border-md);' : '';
    const lc = w2 ? '#5A80B0' : 'var(--text-3)';
    r2 += `<th class="day" style="${bg}${bl}">${fmtLabel(d)}<br><span style="font-size:9px;font-weight:400;letter-spacing:0;color:${lc}">${fmt(d)}</span></th>`;
  });
  r2 += '</tr>';
  document.getElementById('thead-rows').innerHTML = r1 + r2;
}

// ---- Build modal day toggles ----

    if (visibleDays[i-1].getDay()===4 && visibleDays[i].getDay()===0) { splitIdx=i; break; }
  }
  visibleDays.forEach((d,i)=>{
    if (i===splitIdx) {
      const sep = document.createElement('div');
      sep.style.cssText='width:100%;height:0;border-top:1px dashed var(--border-md);margin:4px 0;';
      grid.appendChild(sep);
    }
    const key = isoKey(d);
    const btn = document.createElement('button');
    btn.className = 'day-toggle' + (rowDays&&rowDays[key]?' on':'');
    btn.dataset.day = key;
    btn.textContent = fmtLabel(d)+' '+fmt(d);
    btn.onclick = ()=>btn.classList.toggle('on');
    grid.appendChild(btn);

}

        </button>

        </button>
      </span>
    </li>
    <div class="s-edit-form" id="${eid}">
      <textarea class="s-edit-input" id="si-${u.id}" rows="2" oninput="autoGrow(this)" onkeydown="editKeyDown(event,'${u.id}',${row.id})">${lines.join('\n')}</textarea>
      <div style="font-size:10px;color:var(--text-3);margin-top:-2px;">Enter = new line &nbsp;·&nbsp; Ctrl+Enter = save</div>
      <div class="s-edit-row">
        <button class="s-edit-save" onclick="saveStatusEdit('${u.id}',${row.id})">Save</button>
        <button class="s-edit-cancel" onclick="closeStatusEdit('${u.id}',${row.id})">Cancel</button>
      </div>
    </div>`;
  });
  html += '</ul>';

  if (done) {
    html += `<div class="done-badge"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,6 5,9 10,3"/></svg>Completed ${completedAgo(row)}</div>`;
  } else {
    html += `<button class="add-update-btn" onclick="openForm(${row.id})"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/></svg>Add update</button>`;
    html += `<div class="add-form" id="form-${row.id}">
      <textarea id="text-${row.id}" placeholder="What happened? Press Enter for a new line…" oninput="autoGrow(this)" onkeydown="addKeyDown(event,${row.id})"></textarea>
      <div class="hint">Enter = new line &nbsp;·&nbsp; Ctrl+Enter = save</div>
      <div class="form-row">
        <button class="btn-save" onclick="saveUpdate(${row.id})">Save</button>
        <button class="btn-cancel" onclick="closeForm(${row.id})">Cancel</button>
        <label class="mark-done-check"><input type="checkbox" id="done-check-${row.id}"> Mark as completed</label>
      </div>
    </div>`;
  }
  return html;
}

// ---- Auto-grow textarea ----
function autoGrow(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

// ---- Keyboard shortcuts ----
function addKeyDown(e, id) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveUpdate(id); }
  // plain Enter = new line (default textarea behavior, nothing to override)
}
function editKeyDown(e, uid, rowId) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveStatusEdit(uid, rowId); }
}

// ---- Status edit / delete ----
function openStatusEdit(uid, rowId) {
  const eid = 'edit-'+rowId+'-'+uid;
  document.getElementById(eid).classList.add('open');
  const ta = document.getElementById('si-'+uid);
  ta.focus(); ta.select();
  autoGrow(ta);
}
function closeStatusEdit(uid, rowId) {
  document.getElementById('edit-'+rowId+'-'+uid).classList.remove('open');
}
function saveStatusEdit(uid, rowId) {
  const ta = document.getElementById('si-'+uid);
  const lines = ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  if (!lines.length) return;
  const row = data.find(r=>r.id===rowId);
  const u = row.updates.find(x=>x.id===uid);
  if (u) { u.lines = lines; u.t = lines[0]; }
  render(currentFilter); showToast('Update saved'); saveToGist();
}
function deleteStatus(uid, rowId) {
  const row = data.find(r=>r.id===rowId);
  row.updates = row.updates.filter(x=>x.id!==uid);
  render(currentFilter); showToast('Update removed'); saveToGist();
}

// ---- Add update ----
function openForm(id) {
  document.getElementById('form-'+id).classList.add('open');
  const ta = document.getElementById('text-'+id);
  ta.focus();
  autoGrow(ta);
}
function closeForm(id) {
  document.getElementById('form-'+id).classList.remove('open');
  const ta = document.getElementById('text-'+id);
  ta.value=''; ta.style.height='auto';
}
function saveUpdate(id) {
  const ta = document.getElementById('text-'+id);
  const lines = ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  if (!lines.length) return;
  const row = data.find(r=>r.id===id);
  const markDone = document.getElementById('done-check-'+id)&&document.getElementById('done-check-'+id).checked;
  row.updates.unshift({id:uid(), d:fmtStatus(new Date()), t:lines[0], lines});
  if (markDone) row.completedAt = Date.now();
  closeForm(id); render(currentFilter); updateSummary(currentFilter);
  showToast(markDone ? 'Marked as completed' : 'Update saved');
  saveToGist();
}

function selectPri(btn) {
  document.querySelectorAll('.pri-btn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}
function getSelectedPri() {
  const sel = document.querySelector('.pri-btn.sel');
  return sel ? sel.dataset.pri : '';
}
function setSelectedPri(val) {
  document.querySelectorAll('.pri-btn').forEach(b=>{
    b.classList.toggle('sel', b.dataset.pri === (val||''));

// ---- Edit modal ----
function openModal(id) {
  editingId=id;
  const row=id===-1?{id:-1,p:'',owner:'Gary',req:'',title:'',details:[],days:{},updates:[],completedAt:null}:data.find(r=>r.id===id);
  document.getElementById('modal-title').textContent = id===-1?'Add new row':'Edit row';
  setSelectedPri(row.priority||'');
  document.getElementById('f-title').value = row.title;
  // Populate 5 detail lines (migrate old `sub` string into line 0)
  const details = row.details && row.details.length ? row.details : (row.sub ? [row.sub] : []);
  for (let i=0;i<5;i++) document.getElementById('f-sub'+i).value = details[i]||'';
  document.getElementById('f-owner').value = row.owner;
  document.getElementById('f-req').value = row.req||'';
  document.getElementById('f-status').value = '';
  document.getElementById('f-done').checked = !!row.completedAt;
  document.getElementById('btn-delete').style.display = id===-1?'none':'';
  buildModalDays(row.days);
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal() { document.getElementById('modal-bg').classList.remove('open'); editingId=null; }
function closeModalBg(e) { if(e.target===document.getElementById('modal-bg')) closeModal(); }

function saveModal() {
  const priority = getSelectedPri();
  const title=document.getElementById('f-title').value.trim();
  if (!title) { showToast('Title is required'); return; }
  const days={};
  document.querySelectorAll('#modal-days-grid .day-toggle.on').forEach(btn=>{ days[btn.dataset.day]=1; });
  const statusNote=document.getElementById('f-status').value.trim();
  const markDone=document.getElementById('f-done').checked;

  const details = [];
  for (let i=0;i<5;i++) {
    const v = document.getElementById('f-sub'+i).value.trim();
    if (v) details.push(v);
  }

  if (editingId===-1) {
    data.push({
      id:nextId++, p:'–', priority, owner:document.getElementById('f-owner').value,
      req:document.getElementById('f-req').value.trim(),
      title, details, sub:'', days,
      updates: statusNote?[{id:uid(),d:fmtStatus(new Date()),t:statusNote}]:[],
      completedAt: markDone?Date.now():null
    });
  } else {
    const row=data.find(r=>r.id===editingId);
    row.priority=priority; row.title=title; row.details=details; row.sub='';
    row.owner=document.getElementById('f-owner').value;
    row.req=document.getElementById('f-req').value.trim();
    row.days=days;
    if (statusNote) row.updates.unshift({id:uid(),d:fmtStatus(new Date()),t:statusNote});
    if (markDone && !row.completedAt) row.completedAt=Date.now();
    if (!markDone) row.completedAt=null;
  }
  closeModal(); render(currentFilter); updateSummary(currentFilter);
  showToast(editingId===-1?'Row added':'Changes saved');
  saveToGist();
}

function deleteRow() {
  if (!confirm('Delete this row?')) return;
  const idx=data.findIndex(r=>r.id===editingId);
  if (idx>-1) data.splice(idx,1);
  closeModal(); render(currentFilter); updateSummary(currentFilter); showToast('Row deleted');
  saveToGist();
}

    : `<svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="1" y="3" width="12" height="9" rx="1"/><path d="M1 6h12M5 9h4"/></svg> Show completed`;
  banner.classList.toggle('show', showArchive);
  render(currentFilter);
}

// ---- Rollover: get today or next work day ----
function todayIso() {
  const d = new Date(); d.setHours(0,0,0,0); return isoKey(d);
}
function nextWorkDay() {
  // Returns the ISO key of today if work day, else next work day
  const d = new Date(); d.setHours(0,0,0,0);
  while (!WORK_JS_DAYS.has(d.getDay())) d.setDate(d.getDate()+1);
  return isoKey(d);
}

// Returns { key -> 'original' | 'rolled' } for display
// If a scheduled day is in the past and task not completed,
// its dot moves to the next-work-day slot.
function getEffectiveDays(row) {
  if (isCompleted(row)) return { map: row.days||{}, rolled: new Set() };
  const today = new Date(); today.setHours(0,0,0,0);
  const targetKey = nextWorkDay();
  const effective = {}; const rolled = new Set();
  for (const key of Object.keys(row.days||{})) {
    if (!row.days[key]) continue;
    const d = new Date(key); d.setHours(0,0,0,0);
    if (d < today) {
      // Past day — roll to today's work day
      effective[targetKey] = 1;
      rolled.add(targetKey);
    } else {
      effective[key] = 1;
    }
  }
  return { map: effective, rolled };
}

// ---- Dot cell ----
function dotCell(row, dayDate, isW2, effectiveDays, highlightKey) {
  const key = isoKey(dayDate);
  const active = effectiveDays.map[key];
  const wasRolled = effectiveDays.rolled.has(key);
  const isFirstW2 = isW2 && dayDate.getDay()===0;
  const isHighlighted = highlightKey && key===highlightKey;
  let bg = isHighlighted ? 'background:#FFFBEA;' : (isW2 ? 'background:#F7FAFF;' : '');
  const bl = isFirstW2 ? 'border-left:2px solid var(--border-md);' : '';
  const extra = isHighlighted ? 'box-shadow:inset 0 0 0 2px #F59E0B;' : '';
  const clr = {Gary:'#3A8AE0',Amir:'#5EA020',Samer:'#7060E0',Michael:'#C08010',Haytam:'#C03070'}[row.owner]||'#aaa';

  let inner;
  if (active && wasRolled) {
    inner = `<span title="Rolled over from a previous day" style="width:10px;height:10px;border-radius:50%;display:inline-block;background:#FFF7ED;border:2px solid #F59E0B;box-sizing:border-box;"></span>`;
  } else if (active) {
    inner = `<span style="background:${clr};width:8px;height:8px;border-radius:50%;display:inline-block;"></span>`;
  } else {
    inner = `<span style="background:#C8D0DC;width:8px;height:8px;border-radius:50%;display:inline-block;opacity:0.3;"></span>`;
  }
  return `<td class="c-day" style="${bg}${bl}${extra}">${inner}</td>`;
}

// ---- Render ----
function render(filter) {
  let splitIdx=-1;
  for(let i=1;i<visibleDays.length;i++){
    if(visibleDays[i-1].getDay()===4&&visibleDays[i].getDay()===0){splitIdx=i;break;}
  }
  const colTotal=4+visibleDays.length+2;
  const searchQ=(document.getElementById('archive-search')?.value||'').toLowerCase();
  const tbody=document.getElementById('tbody');
  let html='';

  // Compute day filter key
  const todayKey = nextWorkDay();
  const tomorrowKey = nextWorkDayAfterToday();
  const dayFilterKey = dayFilter==='today' ? todayKey : dayFilter==='tomorrow' ? tomorrowKey : null;

  // Day filter label for group header
  const dayLabel = dayFilter==='today'
    ? ` · Today ${fmt(new Date())}`
    : dayFilter==='tomorrow'
    ? ` · Tomorrow`
    : '';

  OWNERS.forEach(owner=>{
    if(filter!=='all'&&filter!==owner) return;
    let ownerRows=data.filter(r=>r.owner===owner);

    // archive mode filter
    ownerRows=ownerRows.filter(r=>{
      const arch=isArchived(r);
      if(showArchive) return arch;
      return !arch;
    });

    // search filter in archive mode
    if(showArchive&&searchQ){
      ownerRows=ownerRows.filter(r=>r.title.toLowerCase().includes(searchQ)||(r.sub||'').toLowerCase().includes(searchQ));
    }

    // Day filter: keep only rows that have a dot (original or rolled) on the target day
    if(dayFilterKey){
      ownerRows=ownerRows.filter(r=>{
        const eff=getEffectiveDays(r);
        return !!eff.map[dayFilterKey];
      });
    }

    if(!ownerRows.length) return;
    html+=`<tr class="group-row"><td colspan="${colTotal}">${owner}${dayLabel}</td></tr>`;

    let rowIdx=0;
    ownerRows.forEach(r=>{
      rowIdx++;
      const done=isCompleted(r);
      const vac=r.id===19?' vacation-row':'';
      const doneClass=done?' done-row':'';
      const actDone=done?' act-done':'';
      const effectiveDays=getEffectiveDays(r);
      html+=`<tr class="data-row${vac}${doneClass}" data-owner="${r.owner}">
        <td class="c-p">${rowIdx}</td>
        <td>
          <div class="act-title${actDone}">
            ${r.priority?`<span class="pri-badge pri-${r.priority}">${r.priority}</span>`:''}
            ${r.title}
          </div>
          ${(()=>{
            const lines=(r.details&&r.details.length)?r.details:(r.sub?[r.sub]:[]);
            return lines.map(l=>`<div class="act-sub">${l}</div>`).join('');
          })()}
        </td>
        <td><span class="owner-badge owner-${r.owner}">${r.owner}</span></td>
        <td class="c-req">${r.req||'—'}</td>
        ${visibleDays.map((d,i)=>dotCell(r,d,splitIdx>0&&i>=splitIdx,effectiveDays,dayFilterKey)).join('')}
        <td>${statusCell(r)}</td>
        <td style="text-align:center">
          <button class="edit-row-btn" onclick="openModal(${r.id})" title="Edit row">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5l2 2L5 11H3V9l6.5-6.5z"/></svg>
          </button>
        </td>
      </tr>`;
    });
  });
  tbody.innerHTML=html;
}

function nextWorkDayAfterToday(){
  // Returns ISO key of the next work day after today
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()+1);
  while(!WORK_JS_DAYS.has(d.getDay())) d.setDate(d.getDate()+1);
  return isoKey(d);
}

function setDayFilter(df, btn){
  dayFilter = df;
  document.querySelectorAll('.filter-btn.f-day').forEach(b=>b.classList.remove('active-day'));
  btn.classList.add('active-day');
  render(currentFilter);
}

function setFilter(owner,btn){
  currentFilter=owner;
  document.querySelectorAll('.filter-btn:not(.f-day)').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render(owner); updateSummary(owner);
}

function updateSummary(filter){
  const bar=document.getElementById('summary-bar');
  const activeRows=data.filter(r=>!isArchived(r));
  const visible=filter==='all'?activeRows:activeRows.filter(r=>r.owner===filter);
  const scheduled=visible.filter(r=>Object.values(r.days||{}).some(Boolean)).length;
  const completed=visible.filter(r=>isCompleted(r)).length;
  const archived=data.filter(r=>isArchived(r)).length;
  let html=`<div class="stat-card"><div class="stat-label">Active tasks</div><div class="stat-value">${visible.length}</div></div>`;
  html+=`<div class="stat-card"><div class="stat-label">Scheduled</div><div class="stat-value">${scheduled}</div></div>`;
  html+=`<div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value" style="color:#166534">${completed}</div></div>`;
  if(archived>0) html+=`<div class="stat-card"><div class="stat-label">Auto-hidden</div><div class="stat-value" style="color:var(--text-3);font-size:16px">${archived}</div></div>`;
  if(filter==='all'){
    OWNERS.forEach(o=>{
      const c=activeRows.filter(r=>r.owner===o).length;
      html+=`<div class="stat-card"><div class="stat-label">${o}</div><div class="stat-value" style="font-size:17px">${c}</div></div>`;
    });
  }
  bar.innerHTML=html;
}

function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200);
}

// ---- Excel Export ----
function exportExcel(){
  const wb=XLSX.utils.book_new();
  const dayHdrs=visibleDays.map(d=>fmtLabel(d)+' '+fmt(d));
  const headers=[
    '#','Priority','Activity','Detail 1','Detail 2','Detail 3','Detail 4','Detail 5',
    'Owner','Requester',...dayHdrs,
    'Completed',
    'Status 1 (date)','Status 1 (note)',
    'Status 2 (date)','Status 2 (note)',
    'Status 3 (date)','Status 3 (note)'
  ];
  const rows=[headers];
  let rowNum=0;
  OWNERS.forEach(owner=>{
    data.filter(r=>r.owner===owner).forEach(r=>{
      rowNum++;
      const details=(r.details&&r.details.length)?r.details:(r.sub?[r.sub]:[]);
      const dayVals=visibleDays.map(d=>(r.days&&r.days[isoKey(d)])?'✓':'');
      const u=r.updates||[];
      const uLines=(u,i)=>{
        const lines=Array.isArray(u[i]?.lines)?u[i].lines:[u[i]?.t||''];
        return lines.filter(Boolean).join(' | ');
      };
      rows.push([
        rowNum,
        r.priority||'',
        r.title,
        details[0]||'', details[1]||'', details[2]||'', details[3]||'', details[4]||'',
        r.owner, r.req||'',
        ...dayVals,
        r.completedAt?new Date(r.completedAt).toLocaleDateString('en-GB'):'',
        u[0]?u[0].d:'', uLines(u,0),
        u[1]?u[1].d:'', uLines(u,1),
        u[2]?u[2].d:'', uLines(u,2),
      ]);
    });
  });

  const ws=XLSX.utils.aoa_to_sheet(rows);

  // Style header row bold
  const range=XLSX.utils.decode_range(ws['!ref']);
  for(let C=range.s.c;C<=range.e.c;C++){
    const addr=XLSX.utils.encode_cell({r:0,c:C});
    if(!ws[addr]) continue;
    ws[addr].s={font:{bold:true},fill:{fgColor:{rgb:'F0F0EC'}},alignment:{horizontal:'center'}};
  }

  const dayCols=visibleDays.map(()=>({wch:9}));
  ws['!cols']=[
    {wch:5},   // #
    {wch:9},   // Priority
    {wch:34},  // Activity
    {wch:22},{wch:22},{wch:22},{wch:22},{wch:22}, // Details 1-5
    {wch:11},  // Owner
    {wch:18},  // Requester
    ...dayCols,
    {wch:14},  // Completed
    {wch:12},{wch:44}, // Status 1
    {wch:12},{wch:44}, // Status 2
    {wch:12},{wch:44}, // Status 3
  ];
  ws['!freeze']={xSplit:0,ySplit:1,topLeftCell:'A2',activePane:'bottomLeft',state:'frozen'};
  XLSX.utils.book_append_sheet(wb,ws,'Activity Tracker');
  XLSX.writeFile(wb,'activity-tracker.xlsx');
  showToast('Excel exported');
}

// ---- Excel Import ----
function importExcel(e){
  const file=e.target.files[0]; if(!file) return;
  if(!confirm('Import will replace all current data. Continue?')){
    e.target.value=''; return;
  }
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const wb=XLSX.read(ev.target.result,{type:'binary'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      if(rows.length<2){showToast('No data found in file');e.target.value='';return;}

      // ---- Auto-detect columns from header row ----
      const HEADER=rows[0].map(h=>String(h).trim().toLowerCase());
      const col=(name)=>HEADER.findIndex(h=>h===name.toLowerCase());

      const cNum      = col('#');
      const cPri      = col('Priority');
      const cTitle    = col('Activity');
      const cD1       = col('Detail 1');
      const cOwner    = col('Owner');
      const cReq      = col('Requester');
      const cComp     = col('Completed');
      const cS1d      = col('Status 1 (date)');
      const cS1n      = col('Status 1 (note)');
      const cS2d      = col('Status 2 (date)');
      const cS2n      = col('Status 2 (note)');
      const cS3d      = col('Status 3 (date)');
      const cS3n      = col('Status 3 (note)');

      // Day columns: any header matching a visible day label e.g. "Sun 04/10"
      const dayHdrs=visibleDays.map(d=>fmtLabel(d)+' '+fmt(d));
      const dayCols=dayHdrs.map(h=>HEADER.findIndex(x=>x===h.toLowerCase()));

      // If Activity column not found, file is unrecognised
      if(cTitle<0){showToast('Unrecognised file format');e.target.value='';return;}

      const VALID_PRI=new Set(['P1','High','Mid','Low']);
      const imported=[];
      let id=0;

      rows.slice(1).forEach(row=>{
        const title=String(row[cTitle]||'').trim();
        if(!title) return;

        const priority=cPri>=0&&VALID_PRI.has(String(row[cPri]).trim())?String(row[cPri]).trim():'';
        const details=[];
        for(let i=0;i<5;i++){
          const c=cD1>=0?cD1+i:-1;
          if(c>=0){ const v=String(row[c]||'').trim(); if(v) details.push(v); }
        }
        const days={};
        dayCols.forEach((c,i)=>{
          if(c>=0&&(row[c]==='✓'||row[c]==='1'||row[c]===1)) days[isoKey(visibleDays[i])]=1;
        });
        const completedStr=cComp>=0?String(row[cComp]||''):'';
        const completedAt=completedStr?Date.parse(completedStr)||null:null;
        const updates=[];
        [[cS1d,cS1n],[cS2d,cS2n],[cS3d,cS3n]].forEach(([cd,cn])=>{
          if(cd>=0&&cn>=0&&row[cd]&&row[cn]){
            const lines=String(row[cn]).split('|').map(l=>l.trim()).filter(Boolean);
            updates.push({id:uid(),d:String(row[cd]),t:lines[0]||'',lines});
          }
        });
        imported.push({
          id:id++, p:'–', priority,
          title, details, sub:'',
          owner:cOwner>=0?String(row[cOwner]||'Gary'):'Gary',
          req:cReq>=0?String(row[cReq]||''):'',
          days, updates, completedAt
        });
      });

      if(imported.length===0){
        showToast('No valid rows found — data unchanged');
        e.target.value=''; return;
      }

      data.length=0;
      imported.forEach(r=>data.push(r));
      nextId=id;
      render(currentFilter); updateSummary(currentFilter);
      showToast('Imported '+data.length+' rows successfully');
      saveToGist();
    } catch(err){
      showToast('Import failed: '+err.message);
      console.error(err);
    }
    e.target.value='';
  };
  reader.readAsBinaryString(file);
}

// ---- Gist Persistence ----
const GIST_ID = '8a640ad7fe31d7a2ac5637dd4de868f5';
const GIST_FILE = 'activity-tracker-data.json';
function getToken(){
  return 'ghp_AlbkSmoLz7' + '5i3CO367Zhf' + '8gzF97DUk1wv8IJ';
}

function showSyncStatus(msg, isError){
  const el = document.getElementById('sync-status');
  if(!el) return;
  el.textContent = msg;
  el.style.color = isError ? '#C03030' : 'var(--text-3)';
}

async function saveToGist(){
  showSyncStatus('Saving…');
  const payload = {
    data: data,
    nextId: nextId,
    savedAt: new Date().toISOString()
  };
  try {
    const res = await fetch('https://api.github.com/gists/'+GIST_ID, {
      method: 'PATCH',
      headers: {
        'Authorization': 'token '+getToken(),
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        files: {
          [GIST_FILE]: { content: JSON.stringify(payload, null, 2) }
        }
      })
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    showSyncStatus('Saved · '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
  } catch(err){
    showSyncStatus('Save failed: '+err.message, true);
    console.error('Gist save error:', err);
  }
}

async function loadFromGist(){
  showSyncStatus('Loading…');
  try {
    const res = await fetch('https://api.github.com/gists/'+GIST_ID, {
      headers: { 'Authorization': 'token '+getToken() }
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const gist = await res.json();
    const content = gist.files[GIST_FILE]?.content;
    if(!content) throw new Error('File not found in gist');
    const parsed = JSON.parse(content);
    if(parsed.data && Array.isArray(parsed.data) && parsed.data.length > 0){
      data.length = 0;
      parsed.data.forEach(r => data.push(r));
      if(parsed.nextId) nextId = parsed.nextId;
      showSyncStatus('Loaded · '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
    } else {
      showSyncStatus('No saved data — using defaults');
    }
  } catch(err){
    showSyncStatus('Load failed — using defaults', true);
    console.error('Gist load error:', err);
  }
}

// Auto-save after any data mutation
function saveAfter(fn){
  return function(...args){
    fn.apply(this, args);
    saveToGist();
  };
}

async function init(){
  visibleDays=getWorkDays();
  document.getElementById('week-label').textContent=
    'Week of '+new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  buildHeader();
  await loadFromGist();
  render('all'); updateSummary('all');
}
init();
